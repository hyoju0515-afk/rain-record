<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4fa3">
  <link rel="manifest" href="/manifest.json">
  <title>비 알림</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif; color: #18304d; background: #f3f7fc; }
    main { width: 100%; max-width: 420px; padding: 28px 24px; text-align: center; background: white; border: 1px solid #e0e8f2; border-radius: 20px; box-shadow: 0 8px 28px rgba(20,50,90,.08); }
    .icon { font-size: 46px; }
    h1 { margin: 10px 0 8px; font-size: 25px; }
    p { color: #5d6e82; line-height: 1.65; font-size: 14px; }
    input, select { width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #d3dce8; border-radius: 10px; background: #fff; color: #18304d; font-size: 15px; }
    button { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px; color: white; background: #1459a6; font-size: 15px; font-weight: 700; }
    button.secondary { color: #1459a6; background: #eaf2fb; }
    button:disabled { opacity: .6; }
    #status, #locationStatus { min-height: 36px; margin: 12px 0 0; font-size: 13px; overflow-wrap: anywhere; }
    .location-box { margin-top: 20px; padding-top: 18px; border-top: 1px solid #e8edf4; text-align: left; }
    .location-box h2 { margin: 0; font-size: 16px; }
    .location-box .help { margin: 5px 0 8px; font-size: 12px; }
    #currentLocation { margin: 8px 0; color: #18304d; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☔</div>
    <h1>비 알림</h1>
    <p>설정한 위치의 오전 8시 비 예보를 확인해<br>매일 오전 7시 30분에 알려드려요.</p>

    <section class="location-box" aria-labelledby="locationTitle">
      <h2 id="locationTitle">알림 받을 위치</h2>
      <p id="currentLocation">현재 위치를 불러오는 중…</p>
      <p class="help">동네 이름이나 주소를 검색한 뒤 목록에서 선택해 주세요.</p>
      <input id="locationQuery" type="search" placeholder="예: 서울 마포구 연남동" autocomplete="off">
      <button id="searchLocationBtn" class="secondary" type="button">위치 검색</button>
      <select id="locationChoices" aria-label="검색된 위치" hidden></select>
      <button id="saveLocationBtn" type="button" hidden>이 위치로 변경</button>
      <p id="locationStatus" role="status" aria-live="polite"></p>
    </section>

    <button id="notifyBtn" type="button">비 알림 켜기</button>
    <p id="status" role="status" aria-live="polite">아이폰은 Safari에서 홈 화면에 추가한 앱을 열어 알림을 켜주세요.</p>
  </main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const button = $('notifyBtn');
  const status = $('status');
  const say = (message) => { status.textContent = message; };
  const locationStatus = $('locationStatus');
  let matches = [];

  async function loadLocation() {
    try {
      const response = await fetch('/api/location');
      if (!response.ok) throw new Error();
      const location = await response.json();
      $('currentLocation').textContent = '현재 설정: ' + location.name;
    } catch {
      $('currentLocation').textContent = '기본 위치: 광주 북구 중흥동';
    }
  }

  $('searchLocationBtn').addEventListener('click', async () => {
    const query = $('locationQuery').value.trim();
    if (!query) {
      locationStatus.textContent = '검색할 동네나 주소를 입력해 주세요.';
      return;
    }
    const searchButton = $('searchLocationBtn');
    searchButton.disabled = true;
    locationStatus.textContent = '위치를 검색하고 있어요.';
    $('locationChoices').hidden = true;
    $('saveLocationBtn').hidden = true;
    try {
      const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
      url.search = new URLSearchParams({ name: query, count: '8', language: 'ko', format: 'json' });
      const response = await fetch(url);
      if (!response.ok) throw new Error();
      const data = await response.json();
      matches = data.results || [];
      if (!matches.length) {
        locationStatus.textContent = '검색 결과가 없어요. 시·구·동을 함께 입력해 보세요.';
        return;
      }
      const select = $('locationChoices');
      select.replaceChildren();
      matches.forEach((place, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = [place.name, place.admin2, place.admin1, place.country].filter(Boolean).join(' · ');
        select.appendChild(option);
      });
      select.hidden = false;
      $('saveLocationBtn').hidden = false;
      locationStatus.textContent = '정확한 동네를 목록에서 선택한 뒤 변경을 눌러주세요.';
    } catch {
      locationStatus.textContent = '위치 검색에 실패했어요. 잠시 후 다시 시도해 주세요.';
    } finally {
      searchButton.disabled = false;
    }
  });

  $('saveLocationBtn').addEventListener('click', async () => {
    const place = matches[Number($('locationChoices').value)];
    if (!place) return;
    const saveButton = $('saveLocationBtn');
    saveButton.disabled = true;
    locationStatus.textContent = '위치를 저장하고 있어요.';
    try {
      const name = [place.name, place.admin2, place.admin1].filter(Boolean).join(' ');
      const response = await fetch('/api/location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, latitude: place.latitude, longitude: place.longitude })
      });
      if (!response.ok) throw new Error();
      $('currentLocation').textContent = '현재 설정: ' + name;
      locationStatus.textContent = '위치를 변경했어요. 다음 비 예보부터 이 위치를 확인합니다.';
      $('locationChoices').hidden = true;
      saveButton.hidden = true;
    } catch {
      locationStatus.textContent = '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
    } finally {
      saveButton.disabled = false;
    }
  });

  function decodeKey(key) {
    const padding = '='.repeat((4 - key.length % 4) % 4);
    const raw = atob((key + padding).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }
  button.addEventListener('click', async () => {
    button.disabled = true;
    say('알림 설정을 확인하고 있어요.');
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
        throw new Error('이 환경은 웹 푸시를 지원하지 않아요. iOS 16.4 이상에서 Safari로 홈 화면에 추가한 앱을 열어주세요.');
      }
      if (location.protocol !== 'https:') throw new Error('보안 연결(HTTPS)에서 열어주세요.');
      const registration = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      let permission = Notification.permission;
      if (permission === 'default') permission = await Notification.requestPermission();
      if (permission !== 'granted') throw new Error('아이폰 설정에서 이 앱의 알림을 허용한 뒤 다시 눌러주세요.');
      const keyResponse = await fetch('/api/subscribe');
      if (!keyResponse.ok) throw new Error('알림 서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.');
      const { publicKey } = await keyResponse.json();
      if (!publicKey) throw new Error('서버의 VAPID 공개 키 설정을 확인해야 해요.');
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: decodeKey(publicKey)
        });
      }
      const saveResponse = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscription)
      });
      if (!saveResponse.ok) throw new Error('알림 등록을 저장하지 못했어요. Vercel 설정을 확인해야 해요.');
      say('알림이 켜졌어요. 비 예보가 있으면 오전 7시 30분에 알려드릴게요.');
      button.textContent = '알림 켜짐';
    } catch (error) {
      say(error.message || '알림 설정 중 문제가 생겼어요.');
      button.disabled = false;
    }
  });

  loadLocation();
})();
</script>
</body>
</html>
