<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4fa3">
  <link rel="manifest" href="/manifest.json">
  <title>아침 비 알림</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif; color: #18304d; background: #f3f7fc; }
    main { width: 100%; max-width: 420px; padding: 30px 24px; text-align: center; background: white; border: 1px solid #e0e8f2; border-radius: 20px; box-shadow: 0 8px 28px rgba(20,50,90,.08); }
    .icon { font-size: 48px; }
    h1 { margin: 12px 0 8px; font-size: 25px; }
    p { color: #5d6e82; line-height: 1.65; font-size: 14px; }
    button { width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 12px; color: white; background: #1459a6; font-size: 16px; font-weight: 700; }
    button:disabled { opacity: .6; }
    #status { min-height: 48px; margin-top: 16px; font-size: 13px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☔</div>
    <h1>아침 비 알림</h1>
    <p>광주 북구 중흥동<br>매일 오전 7시 30분에 확인해<br>오전 8시 비가 예상되면 아이폰으로 알려드려요.</p>
    <button id="notifyBtn" type="button">비 알림 켜기</button>
    <p id="status" role="status" aria-live="polite">아이폰은 Safari에서 홈 화면에 추가한 앱을 열어 알림을 켜주세요.</p>
  </main>
<script>
(() => {
  const button = document.getElementById('notifyBtn');
  const status = document.getElementById('status');
  const say = (message) => { status.textContent = message; };
  function decodeKey(key) {
    const padding = '='.repeat((4 - key.length % 4) % 4);
    const raw = atob((key + padding).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }
  button.addEventListener('click', async () => {
    button.disabled = true;
    say('알림 설정을 확인하고 있어요.');
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
        throw new Error('이 환경은 웹 푸시를 지원하지 않아요. iOS 16.4 이상에서 Safari로 홈 화면에 추가한 앱을 열어주세요.');
      }
      if (location.protocol !== 'https:') throw new Error('보안 연결(HTTPS)에서 열어주세요.');
      const registration = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      let permission = Notification.permission;
      if (permission === 'default') permission = await Notification.requestPermission();
      if (permission !== 'granted') throw new Error('아이폰 설정에서 이 앱의 알림을 허용한 뒤 다시 눌러주세요.');
      const keyResponse = await fetch('/api/subscribe');
      if (!keyResponse.ok) throw new Error('알림 서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.');
      const { publicKey } = await keyResponse.json();
      if (!publicKey) throw new Error('서버의 VAPID 공개 키 설정을 확인해야 해요.');
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: decodeKey(publicKey)
        });
      }
      const saveResponse = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscription)
      });
      if (!saveResponse.ok) throw new Error('알림 등록을 저장하지 못했어요. Vercel 설정을 확인해야 해요.');
      say('알림이 켜졌어요. 비 예보가 있으면 오전 7시 30분에 알려드릴게요.');
      button.textContent = '알림 켜짐';
    } catch (error) {
      say(error.message || '알림 설정 중 문제가 생겼어요.');
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
